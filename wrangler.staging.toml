name = "fm5-staging"
main = ".output/server/index.mjs"
compatibility_date = "2025-09-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"

[observability]
enabled = true

[vars]
NODE_ENV = "staging"
APP_ENV = "staging"

[[r2_buckets]]
binding = "FILE_STORAGE"
bucket_name = "fm5-staging-files"
